[package]
name = "hyperion-voice"
version = "0.1.0"
edition = "2021"
description = "Say \"Hey Jarvis\" and a question: the answer shows in the notch, or Hyperion comes forward with it."
license = "BSD-3-Clause"
publish = false

[dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
ort = "=2.0.0-rc.10"
ureq = { version = "2.12", default-features = false, features = ["json"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
