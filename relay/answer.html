<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyperion</title>
<style>
:root{--win:#2a2a2c;--list:#1c1c1e;--page:#161618;--sep:#000;--row:#2c2c2e;--t1:#e5e5e7;--t2:#a1a1a6;--t3:#8e8e93;--sel:#1f5fd1;--ok:#30d158;--warn:#ffd60a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--list);color:var(--t1);font:14px -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column}
header{height:52px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--win);border-bottom:1px solid var(--sep)}
header label{flex:1;max-width:760px;margin:0 auto;height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:8px;background:var(--list);border:1px solid #3a3a3c}
header label:focus-within{border-color:#0a84ff}
header input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--t1);font:inherit;font-size:14px}
header .st{font-size:11.5px;color:var(--t3);white-space:nowrap}
main{flex:1;min-height:0;display:flex}
#left{width:620px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--sep)}
#ans{padding:28px 32px 24px;background:#202022;border-bottom:1px solid var(--sep);display:flex;flex-direction:column;gap:12px;min-height:150px}
.meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t3)}
.chip{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;font-size:11px;font-weight:600;white-space:nowrap;background:#2f2f32;color:#c7c7cc}
.chip.ok{background:rgba(48,209,88,.14);color:var(--ok)}
#short{font-size:46px;font-weight:600;letter-spacing:-.02em;line-height:1.08}
#short.long{font-size:21px;font-weight:600;letter-spacing:0;line-height:1.4}
#sentence{font-size:16px;line-height:1.5;color:var(--t1)}
#timing{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--t3)}
#timing b{color:var(--t1);font-weight:600}
.btns{display:flex;gap:8px}
button{font:inherit;font-size:12.5px;height:30px;padding:0 12px;border:0;border-radius:6px;background:#3a3a3c;color:var(--t1);cursor:pointer}
kbd{font:11px -apple-system,system-ui,sans-serif;color:var(--t2);background:#2c2c2e;border:1px solid #3a3a3c;border-radius:4px;padding:1px 5px;margin-left:6px}
.label{padding:14px 32px 6px;font-size:11px;font-weight:600;color:var(--t3)}
#sources{flex:1;min-height:0;overflow:auto}
.src{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 32px;border-bottom:1px solid var(--row);cursor:pointer}
.src .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .h{font-size:11.5px;color:var(--t3);margin-top:3px}
.src.on{background:var(--sel)}
.src.on .h{color:#c9daff}
#right{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--page)}
#bar{height:34px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 16px;background:#1f1f21;border-bottom:1px solid var(--sep);font-size:11.5px;color:var(--t2);white-space:nowrap}
#bar .u{font-family:ui-monospace,"SF Mono",Menlo,monospace;overflow:hidden;text-overflow:ellipsis}
#doc{flex:1;min-height:0;overflow:auto;padding:30px 52px 80px}
#doc .in{max-width:780px}
#doc h1{font-size:26px;font-weight:600;margin:0 0 16px}
#doc p{font-size:15.5px;line-height:1.62;color:#c7c7cc;margin:0 0 14px}
mark{background:rgba(255,214,10,.2);color:#f2f2f7;border-radius:3px;padding:1px 2px;box-shadow:0 0 0 1px rgba(255,214,10,.35)}
.muted{color:var(--t3)}
footer{height:26px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:0 14px;background:var(--win);border-top:1px solid var(--sep);font-size:11.5px;color:var(--t2);white-space:nowrap}
footer .r{margin-left:auto;display:flex;gap:16px}
.skel{color:var(--t3)}
</style>
</head>
<body>
<header>
  <label><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
  <input id="q" aria-label="Search" autocomplete="off" spellcheck="false" placeholder="Ask anything"></label>
  <span class="st" id="st"></span>
</header>
<main>
  <section id="left" aria-label="Answer">
    <div id="ans">
      <div class="meta" id="meta"></div>
      <div id="short" class="skel"></div>
      <div id="sentence"></div>
      <div id="timing"></div>
      <div class="btns"><button id="copy">Copy with source<kbd>C</kbd></button></div>
    </div>
    <div class="label">Sources</div>
    <div id="sources" role="listbox" aria-label="Sources"></div>
  </section>
  <section id="right" aria-label="Source page">
    <div id="bar"><span class="u" id="url"></span><span style="margin-left:auto">scrolled to the line the answer came from<kbd>⏎</kbd></span></div>
    <div id="doc"><div class="in" id="docin"></div></div>
  </section>
</main>
<footer><span id="foot">Answers come from the relay; nothing runs on this Mac</span><span class="r"><span>↑↓ sources</span><span>⏎ open the page at the line</span><span>C copy</span><span>/ new search</span></span></footer>
<script>
const $ = (id) => document.getElementById(id);
let S = null, ctl = null, sel = 0, debounce = 0;
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const clean = (s) => s.replace(/\[(.*?)\]\([^)]*\)/g, "$1").replace(/[*_`#>|]+/g, "").replace(/\s+/g, " ").trim();

function reset(q) {
  S = {q, results: [], pages: [], passage: null, answer: null, t: {}};
  sel = 0;
  $("meta").innerHTML = ""; $("sentence").textContent = ""; $("timing").innerHTML = "";
  $("short").className = "skel"; $("short").textContent = q ? "…" : "";
  $("sources").innerHTML = ""; $("docin").innerHTML = ""; $("url").textContent = "";
}

async function run(q) {
  if (ctl) ctl.abort();
  reset(q);
  if (!q) return;
  ctl = new AbortController();
  const mine = ctl;
  const t0 = performance.now();
  $("st").textContent = "searching";
  try {
    const r = await fetch("/v1/answer", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({q, texts: true}), signal: mine.signal});
    const rd = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const {value, done} = await rd.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 1);
        if (line) onEvent(JSON.parse(line), (performance.now() - t0) / 1000);
      }
    }
  } catch (e) { if (e.name !== "AbortError") $("st").textContent = "relay unreachable"; }
}

function onEvent(ev, secs) {
  if (ev.type === "sources") { S.results = ev.results; S.t.sources = secs; renderSources(); }
  else if (ev.type === "pages") { S.pages = ev.pages; renderDoc(); }
  else if (ev.type === "passage") { S.passage = ev; S.t.passage = secs; renderAnswer(); renderDoc(); }
  else if (ev.type === "answer") {
    S.answer = ev; S.t.answer = secs;
    if (ev.passage) { S.passage = {text: ev.passage, url: ev.url, host: ev.host}; sel = srcIndexFor(ev.url); renderSources(); }
    renderAnswer(); renderDoc();
  }
  else if (ev.type === "done") { $("st").textContent = ""; }
  else if (ev.type === "error") { $("short").textContent = "No answer"; $("st").textContent = ev.error; }
}

function srcIndexFor(url) {
  const i = S.results.findIndex((r) => r.url === url);
  return i < 0 ? 0 : i;
}

function renderAnswer() {
  const a = S.answer, p = S.passage;
  const url = (a && a.url) || (p && p.url) || "";
  const host = (a && a.host) || (p && p.host) || "";
  const r = S.results[srcIndexFor(url)] || {};
  $("meta").innerHTML = (r.official ? '<span class="chip ok">Official</span>' : "") + `<span>${esc(host)}</span>`;
  const short = a && a.short ? clean(a.short) : (p ? clean(p.text.split(" · ").join(" ")) : "");
  const el = $("short");
  el.textContent = short || "…";
  el.className = short.length > 42 ? "long" : "";
  const sentence = p ? clean(p.text.split(" · ").join(" ")) : "";
  $("sentence").textContent = sentence && sentence !== short ? sentence : "";
  const parts = [];
  if (S.t.passage) parts.push(`<span><b>${S.t.passage.toFixed(1)} s</b> sentence from the page</span>`);
  if (a && a.by === "model") parts.push(`<span><b>${S.t.answer.toFixed(1)} s</b> one-line answer</span>`);
  $("timing").innerHTML = parts.join("");
  if (p && sel === 0) { sel = srcIndexFor(p.url); renderSources(); renderDoc(); }
}

function renderSources() {
  $("sources").innerHTML = S.results.map((r, i) =>
    `<div class="src${i === sel ? " on" : ""}" role="option" data-i="${i}"><div style="min-width:0"><div class="t">${esc(r.title || r.host)}</div>` +
    `<div class="h">${esc(r.host)}</div></div><div>${r.official ? '<span class="chip ok">Official</span>' : ""}</div></div>`).join("");
}

function pageFor(url) {
  return S.pages.find((p) => p.url === url || p.final_url === url);
}

function renderDoc() {
  const r = S.results[sel];
  if (!r) return;
  $("url").textContent = r.url;
  const pg = pageFor(r.url);
  // A passage is a line plus its short neighbours joined by " · "; mark each part.
  const hl = S.passage && S.passage.url === r.url ? S.passage.text.split(" · ").map(clean).filter((x) => x.length > 2) : [];
  if (!pg) {
    $("docin").innerHTML = `<h1>${esc(r.title || r.host)}</h1><p>${esc(r.snippet || "")}</p><p class="muted">Not read yet. Press Enter to open it.</p>`;
    return;
  }
  const paras = pg.text.split(/\n{2,}/).map(clean).filter(Boolean).slice(0, 120);
  let first = true;
  const html = paras.map((t) => {
    let h = esc(t);
    for (const part of hl) {
      if (t.includes(part)) {
        h = h.replace(esc(part), `<mark${first ? ' id="hit"' : ""}>${esc(part)}</mark>`);
        first = false;
      }
    }
    return `<p>${h}</p>`;
  }).join("");
  $("docin").innerHTML = `<h1>${esc(pg.title || r.title || r.host)}</h1>` + html;
  const hit = $("hit");
  if (hit) hit.scrollIntoView({block: "center"}); else $("doc").scrollTop = 0;
}

function fragmentUrl(r) {
  if (!S.passage || S.passage.url !== r.url) return r.url;
  const longest = S.passage.text.split(" · ").map(clean).sort((a, b) => b.length - a.length)[0] || "";
  const w = longest.split(" ");
  const start = w.slice(0, 5).join(" "), end = w.length > 10 ? w.slice(-4).join(" ") : "";
  return r.url.split("#")[0] + "#:~:text=" + encodeURIComponent(start) + (end ? "," + encodeURIComponent(end) : "");
}

function openSel() { const r = S && S.results[sel]; if (r) location.href = fragmentUrl(r); }

function copy() {
  if (!S) return;
  const a = S.answer, p = S.passage, url = (a && a.url) || (p && p.url) || "";
  const text = clean((a && a.short) || (p && p.text) || "");
  if (text) navigator.clipboard.writeText(`${text} (${url})`);
  $("st").textContent = "copied";
}

$("q").addEventListener("input", (e) => {
  clearTimeout(debounce);
  const q = e.target.value.trim();
  debounce = setTimeout(() => {
    history.replaceState(null, "", q ? "?q=" + encodeURIComponent(q) : location.pathname);
    run(q);
  }, 180);
});
$("sources").addEventListener("click", (e) => {
  const row = e.target.closest(".src");
  if (row) { sel = +row.dataset.i; renderSources(); renderDoc(); }
});
$("copy").addEventListener("click", copy);
document.addEventListener("keydown", (e) => {
  const inInput = document.activeElement === $("q");
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (!S || !S.results.length) return;
    e.preventDefault();
    sel = Math.max(0, Math.min(S.results.length - 1, sel + (e.key === "ArrowDown" ? 1 : -1)));
    renderSources(); renderDoc();
  } else if (e.key === "Enter") {
    e.preventDefault(); openSel();
  } else if (!inInput && (e.key === "c" || e.key === "C") && !e.metaKey) {
    copy();
  } else if (!inInput && e.key === "/") {
    e.preventDefault(); $("q").focus(); $("q").select();
  } else if (e.key === "Escape") {
    $("q").focus(); $("q").select();
  }
});

const q0 = new URLSearchParams(location.search).get("q") || "";
$("q").value = q0;
if (q0) { run(q0); $("q").blur(); } else { $("q").focus(); }
</script>
</body>
</html>
